server:
  port: 8084

# Servisler arasi (Feign) cagrilarin kimligi: paylasilan sir. Bos ise ic cagri KABUL EDILMEZ (fail-closed).
internal:
  token: ${INTERNAL_TOKEN:}

spring:
  application:
    name: reservation-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/library_db}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0   # 0 + idempotent V1: dolu DB'de V1 tekrar calisir ve zarar vermez; bos DB'de kurar
    # Aynı DB'yi 5 servis paylaşıyor; her servis kendi history tablosunu kullanır.
    table: flyway_schema_history_reservation
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://discovery-server:8761/eureka/}
  instance:
    prefer-ip-address: false

# Rezervasyon zamanlanmış işleri (expire + fulfill)
reservation:
  scheduler:
    enabled: ${RESERVATION_SCHEDULER_ENABLED:true}
    expire-interval-ms: ${RESERVATION_EXPIRE_INTERVAL_MS:60000}
    fulfill-interval-ms: ${RESERVATION_FULFILL_INTERVAL_MS:60000}


