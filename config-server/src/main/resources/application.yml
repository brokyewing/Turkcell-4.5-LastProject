server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # native profili olmadan config-server varsayılan git depo sağlayıcısını seçip açılışta patlar.
    active: native
  cloud:
    config:
      server:
        native:
          # Servislerin kendi application.yml'leri var; config-server şu an istemciye
          # yapılandırma sunmuyor (spring.config.import kullanan servis yok).
          # İleride bağlanırsa dosyalar buraya taşınacak.
          search-locations: classpath:/

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://discovery-server:8761/eureka/}
  instance:
    prefer-ip-address: false


