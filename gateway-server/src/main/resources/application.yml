server:
  port: 8080

spring:
  application:
    name: gateway-server
  cloud:
    gateway:
      # CORS: Vite dev sunucusu /api'yi proxy'ler (aynı origin), ama `npm run preview`
      # (4173) veya ayrı origin'deki bir frontend doğrudan gateway'e konuşacaksa
      # tarayıcı preflight'ı geçmeli. Token localStorage'da ve Authorization başlığıyla
      # gittiği için cookie tabanlı CSRF riski yok; bu yüzden allow-credentials=false.
      # İzinli origin'ler CORS_ALLOWED_ORIGINS (virgülle ayrılmış) ile genişletilebilir.
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:4173}
            allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowed-headers: [Authorization, Content-Type, X-Requested-With]
            exposed-headers: [X-Auth-Error]
            allow-credentials: false
            max-age: 3600
      routes:
        - id: book-service
          uri: lb://book-service
          predicates:
            - Path=/api/books/**,/api/authors/**,/api/categories/**,/api/copybooks/**
        - id: loan-service
          uri: lb://loan-service
          predicates:
            - Path=/api/loans/**,/api/borrow/**
        - id: member-service
          uri: lb://member-service
          predicates:
            - Path=/api/members/**,/api/students/**,/api/departments/**,/api/auth/**
        - id: reservation-service
          uri: lb://reservation-service
          predicates:
            - Path=/api/reservations/**
        - id: fine-service
          uri: lb://fine-service
          predicates:
            - Path=/api/fines/**
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://discovery-server:8761/eureka/}
  instance:
    prefer-ip-address: false

